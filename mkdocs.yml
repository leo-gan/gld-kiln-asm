site_name: Kiln Assembly
site_description: Pure x86-64 GAS Assembly implementation of Kiln Wire Format v2 with MODE=nolibc and MODE=cabi switch
site_author: Leonid Ganeline
site_url: https://leo-gan.github.io/gld-kiln-asm/
repo_url: https://github.com/leo-gan/gld-kiln-asm
repo_name: leo-gan/gld-kiln-asm
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Leonid Ganeline. MIT.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leo-gan/gld-kiln-asm
      name: GitHub Repository

plugins:
  - search

markdown_extensions:
  - attr_list
  - footnotes
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Assembly Implementation:
    - Quickstart & Examples: asm/quickstart.md
    - API & ABI Reference: asm/api.md
    - Implementation & Verification: asm/internals.md
  - Experiments: experiments.md
  - Normative Spec (v2): https://leo-gan.github.io/gld-kiln/spec/
