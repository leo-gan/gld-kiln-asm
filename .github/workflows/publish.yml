name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Linux x86-64 release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify conformance & zero-libc builds
        run: ./scripts/run-tests.sh

      - name: Stage release artifacts & SHA256SUMS
        run: |
          mkdir -p dist
          cp lib/libkiln_asm.a dist/libkiln_asm.a
          cp lib/libkiln_asm.so dist/libkiln_asm.so
          cp include/kiln_asm.h dist/kiln_asm.h
          cp bin/kiln_bench_nolibc dist/kiln_bench_nolibc
          cp codegen/gld_kilngen_asm.py dist/gld_kilngen_asm.py
          (cd dist && sha256sum libkiln_asm.a libkiln_asm.so kiln_asm.h kiln_bench_nolibc gld_kilngen_asm.py > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gld-kiln-asm-linux-x86_64
          path: dist/

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/libkiln_asm.a \
            dist/libkiln_asm.so \
            dist/kiln_asm.h \
            dist/kiln_bench_nolibc \
            dist/gld_kilngen_asm.py \
            dist/SHA256SUMS \
            --clobber
